# dsh-rigorquant bundle patch — the skill layer of this distribution.
#
# `dsh plugin --profile <p> add dsh-rigorquant` (or the github: spec) makes
# the `rigorquant` skill available to every session of that profile. The full
# RigorQuant agent preset (persona + orchestration + tools) installs
# separately with ./install.sh.
#
# `baseUrl` anchors at this file's location — the installed package root — so
# the skill directory resolves inside the package wherever pnpm put it. The
# provider scans ONLY this custom root (includeDefaultRoots: false) so it can
# never double-supply skills the user's own roots already provide.
- insert:
    - id: skill-filesystem-rigorquant
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: rigorquant
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('agent-presets/rigorquant/skills/', baseUrl))"
