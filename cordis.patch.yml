# dsh-rigorquant bundle patch — the skill layer and model router of this
# distribution.
#
# `dsh plugin --profile <p> add dsh-rigorquant` (or the github: spec) makes
# the `rigorquant` skill and the role-model router available to every session
# of that profile. The full RigorQuant agent preset (persona + orchestration +
# tools) installs separately with ./install.sh.
#
# The skill directory is resolved through the PACKAGE, not through `baseUrl`.
# A patch file's `!!js` runs against the boot root context, whose `baseUrl` is
# the PROFILE directory (`dsh-app-boot`: `ctx.baseUrl = dirname(absoluteConfigPath)`),
# not this file's package root — per-file base anchors are an `Include`
# behaviour that only composition files get. `createRequire` therefore walks
# the profile's `node_modules` to the installed package, wherever pnpm put it.
#
# `includeDefaultRoots: false` keeps THIS provider off the default roots; it
# does not stop the default provider from serving them. A machine that also ran
# ./install.sh therefore has rigorquant, arxiv, and academic-paper-search in
# both places. That resolves deterministically rather than ambiguously: a
# custom root ranks 300 and $DSH_HOME/skills ranks 400, and the lower rank wins
# a duplicate name, so the copy shipped with this package is always the one
# that serves. The $DSH_HOME/skills copies are shadowed, not consulted —
# running ./install.sh --skill-only alongside the plugin is redundant, not
# harmful.
- insert:
    - id: skill-filesystem-rigorquant
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: rigorquant
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl + 'package.json').resolve('dsh-rigorquant/package.json')), 'agent-presets', 'rigorquant', 'skills')"

    # Role-routed models (see docs/architecture.md, Decision 16). The plugin
    # serves the `rigorquant-models` settings namespace (the browser half
    # renders its form on this bundle's page under Plugins) and overlays
    # explicit per-role choices plus a fallback on terminal route failure. The
    # fixed oracle/adversary primary defaults live in the native
    # `agentOptions` on their tool rows; every other role
    # inherits the session model (root follows the chatbox picker). Untagged
    # sessions — other presets, workflow workers, fork children — are never
    # touched.
    - id: rq-model-router
      name: 'dsh-rigorquant'

    # Live team-activity monitor + browser floater (README "The team, live").
    # Pure observation: it tracks role agents from events the core already
    # publishes, then serves a JSON snapshot plus the role portraits to
    # the browser `shell.overlay` panel over /plugins/dsh-rigorquant/... — the
    # same surface dsh-agent-teams uses for its activity panel. Webless
    # profiles never mount webServer, so the routes register lazily via
    # internal/service; the monitor itself is inert there. Design adapted from
    # dsh-agent-teams © NanmiCoder (程序员阿江 / Relakkes), MIT License.
    - id: rq-activity
      name: 'dsh-rigorquant/activity'

    # Self-installing distribution (docs/architecture.md, Decision 22). The
    # bundle-patch plane cannot express an agent preset — the harness pins the
    # agent-presets roots to its shipped root — and node_modules cannot host
    # the uv lane. This host half therefore lands files at boot: the preset
    # into $DSH_HOME/.agent-presets/rigorquant, env/mcp/docs into
    # $DSH_HOME/share/rigorquant/. Idempotent byte-compare; derived state
    # (.venv, __pycache__) never copied or pruned; a same-version target keeps
    # local edits; removal stays explicit via ./install.sh --uninstall.
    - id: rq-preset-sync
      name: 'dsh-rigorquant/sync'

    # Team composition: role personas, tool-tier budgets, and the "RigorQuant
    # team guard: armed" runtime context line (docs/architecture.md,
    # Decision 24; docs/adr/0001-rigorquant-on-agent-teams.md). Declares the
    # `agentTeams` service OPTIONAL and reaches it duck-typed by service name,
    # never importing the experimental Agent Teams packages; the classic
    # `[[rq:role=...]]` mechanism and the seven classic delegation rows above
    # are untouched and coexist with this row until a later issue removes
    # them. Per-call guards (send_message target, roster-blindness,
    # own-task-only board access, bash network denial, spawn_teammate
    # refusal) are a later issue — this row is composition only.
    - id: rq-team
      name: 'dsh-rigorquant/team'
