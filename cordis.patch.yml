# dsh-rigorquant bundle patch — the skill layer and model router of this
# distribution.
#
# `dsh plugin --profile <p> add dsh-rigorquant` (or the github: spec) makes
# the `rigorquant` skill and the role-model router available to every session
# of that profile, and declares the `rigorquant` preset through
# ./agent-presets/rigorquant.patch.yml. The plugin manager is the only install
# and uninstall mechanism (Decision 29): `dsh plugin add`/`remove` are the
# commands, the boot-sync row below lands the compute lane, and this release
# performs no profile migration. It manages no Agent Teams bundle either, which
# DSH 0.2.2 mounts from the base bundle (Decision 28;
# docs/adr/0005-rigorquant-on-dsh-0.2.2.md).
#
# The skill directory is resolved through the PACKAGE, not through `baseUrl`.
# A patch file's `!!js` runs against the boot root context, whose `baseUrl` is
# the PROFILE directory (`dsh-app-boot`: `ctx.baseUrl = dirname(absoluteConfigPath)`),
# not this file's package root — per-file base anchors are an `Include`
# behaviour that only composition files get. `createRequire` therefore walks
# the profile's `node_modules` to the installed package, wherever pnpm put it.
#
# `includeDefaultRoots: false` keeps THIS provider off the default roots; it
# does not stop the default provider from serving them. A machine with skills
# in $DSH_HOME/skills therefore has rigorquant, arxiv, and
# academic-paper-search twice. That resolves deterministically rather than
# ambiguously: a custom root ranks 300 and $DSH_HOME/skills ranks 400, and the
# lower rank wins a duplicate name, so the copy shipped with this package is
# always the one that serves. The $DSH_HOME/skills copies are shadowed, not
# consulted.
- insert:
    - id: skill-filesystem-rigorquant
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: rigorquant
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl + 'package.json').resolve('dsh-rigorquant/package.json')), 'agent-presets', 'rigorquant', 'skills')"

    # Role-routed models (see docs/architecture.md, Decisions 16 and 25). Each
    # role's primary and fallback are `.volatile()` fields of THIS row's
    # config (`<role>Primary`, `<role>Fallback`), so the profile owns them
    # and a saved route applies on the next request; the browser half edits
    # them on this bundle's page under Plugins. The router overlays those
    # choices plus a fallback on terminal route failure. It carries the
    # shipped tier matrix itself (DoubleChecker and adversary on pro; every
    # other role inherits the session model, root following the chatbox
    # picker), moves that matrix to `deepseek-account` when only the account
    # route is routable, and resolves the role from the live subagent-tree
    # name (Decision 24, restated on the 0.2.2 identity API by Decision 28).
    # Agents with no live tree identity, or outside this preset, are never
    # touched.
    - id: rq-model-router
      name: 'dsh-rigorquant'

    # Compute-lane sync (docs/architecture.md, Decisions 22 and 25). The
    # preset is declared in ./agent-presets/rigorquant.patch.yml; what a
    # declaration cannot serve is the uv lane, since node_modules cannot host
    # it. This host half therefore lands env/, mcp/ and docs/ into
    # $DSH_HOME/share/rigorquant/ at boot (idempotent byte-compare; derived
    # state such as .venv never copied or pruned) and removes the directory
    # preset an older release landed, only when its .rq-sync.json names this
    # package. The lane stays on uninstall: it is study evidence (a study's
    # study.json records its path), not plugin state.
    - id: rq-lane-sync
      name: 'dsh-rigorquant/sync'

    # Team composition: role personas, tool-tier budgets, and the "RigorQuant
    # team guard: armed" runtime context line (docs/architecture.md,
    # Decision 24; docs/adr/0001-rigorquant-on-agent-teams.md). Declares the
    # `agentTeams` service OPTIONAL and reaches it duck-typed by service name,
    # never importing the experimental Agent Teams packages. It arms Team per
    # Session for a RigorQuant root Session (Decision 28) and registers the
    # per-call guards (send_message recipient, roster-blindness, own-task-only
    # board access, bash network denial, subagent name / subagent_fork
    # refusal). The preset carries no classic delegation row, so this row is
    # the only source of a teammate's composition.
    - id: rq-team
      name: 'dsh-rigorquant/team'

# Capacity (0.8.1; Decision 24's lifetime member cap is superseded): the
# base bundle mounts the subagent service, which defaults to 8 live children
# per root. A study delegates to up to 12 live teammates, and there is no
# lifetime cap -- once a teammate settles, another may take its slot.
#
# A non-insert, id-targeted patch replaces the row's `config` WHOLE
# (`@deepseek-ai/cordis-plugin-include`'s `applyEntryPatches`), so `maxDepth`
# must be restated here: leaving it out would silently fall back to the core's
# default instead of the preset's depth-one delegation. Keep this row in sync
# with the loader warning: it is a no-op -- not an error -- only where the
# base bundle is absent.
- id: subagent
  config:
    maxDepth: 1
    maxActiveSubagents: 12
