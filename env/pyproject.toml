[project]
name = "rigorquant-lane"
version = "0.1.0"
description = "Pinned uv compute lane for the dsh-rigorquant framework: symbolic exactness, convex optimization, sampling, and falsification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "sympy>=1.13,<2",
  "mpmath>=1.3,<2",
  "cvxpy[clarabel,scs]>=1.6,<2",
  "pytest>=8.3,<9",
  "hypothesis>=6.112,<7",
  "jax>=0.4.35,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
