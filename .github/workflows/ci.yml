name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The compile gate is not optional: a validator that cannot build the
      # stage-4 artifacts would skip its own strongest check in CI.
      #
      # texlive-pictures carries pgf, which `beamer.cls` requires
      # (pgfmath.sty); base + recommended alone leave the deck uncompilable,
      # and `--no-install-recommends` means nothing pulls it in for us. A
      # machine with a full MacTeX hides the omission, which is why every run
      # before this one failed with a missing pgfmath.sty.
      - name: Install a TeX engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-pictures

      - name: Sync the pinned compute lane
        run: uv sync --frozen --project env

      # The pre-commit gate (hooks at .githooks/pre-commit): the suite must
      # pass AND the shipped validator must stay at >= 95% coverage. CI runs
      # exactly what the hook runs -- ship-what-you-test.
      - name: Run the test suite under the coverage gate
        run: |
          RQ_COVERAGE=1 uv run --frozen --project env python -m pytest tests/ -q
          uv run --frozen --project env python -m coverage combine --rcfile .coveragerc
          uv run --frozen --project env python -m coverage report --rcfile .coveragerc --fail-under=95

      # Distribution is the plugin manager (Decision 29): no installer, and no
      # `dsh` on the runner is needed to prove the published package has the
      # shape the plugin manager and the boot sync consume -- both patch
      # files, every export, the lane templates, and no reference to a removed
      # installer. Plain python3, so a machine with no DSH can run it too.
      - name: Smoke-test the package shape (no DSH required)
        run: python3 tests/package_shape_smoke.py
